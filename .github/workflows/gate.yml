# The gate, in CI. It runs `scripts/gate.sh` itself rather than a copied step list, so a pull
# request and a tag are judged by the same script and the two cannot drift.
#
# What differs from a laptop is the toolchain: `stable` here is whatever `stable` is on the day,
# and a newer clippy can fail a commit that passed locally (AGENTS.md § The gate). A second job
# builds on the declared `rust-version`, because nothing else in the repository would notice that
# promise breaking — a dependency raising its own MSRV is enough.
#
# The substrate dependency is a private repository (`crates/harness-substrate/Cargo.toml`), and
# `GITHUB_TOKEN` cannot read across repositories. An installation token minted from the same
# b10x-bot GitHub App that `scripts/bot-token.sh` uses is what reaches it; atlas's
# `scripts/bot-ci-secrets.sh` is what puts the two secrets on a repository. Without them the token
# step fails by name and nothing is built — a missing credential is a red gate, not a skipped one.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Token for the private substrate dependency
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: substrate

      # Cargo fetches with the system git (`.cargo/config.toml`), so a git-level URL rewrite is
      # what carries the token. Scoped to this org's URLs; the token expires with the job.
      - name: Point git at the token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/beyond10x/".insteadOf \
            "https://github.com/beyond10x/"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The script's own exit status, never a pipeline's.
      - name: Gate
        run: bash scripts/gate.sh

  msrv:
    name: MSRV 1.97
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Token for the private substrate dependency
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: substrate

      - name: Point git at the token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/beyond10x/".insteadOf \
            "https://github.com/beyond10x/"

      # `rust-version = "1.97"` in Cargo.toml is a promise to anyone who embeds these crates.
      - uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build on the declared rust-version
        run: cargo build --workspace --locked
