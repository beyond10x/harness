# The gate, in CI. It runs the repository's Rust xtask rather than a copied step list, so a pull
# request and a tag are judged by the same implementation and the two cannot drift.
#
# What differs from a laptop is the toolchain: `stable` here is whatever `stable` is on the day,
# and a newer clippy can fail a commit that passed locally (AGENTS.md § The gate). A second job
# builds on the declared `rust-version`, because nothing else in the repository would notice that
# promise breaking — a dependency raising its own MSRV is enough.
#
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history, because the contract checkers compare every released file with its bytes on
      # `origin/main` and refuse when that ref is absent. A default checkout fetches only the pull
      # request's merge ref, so the comparison had nothing to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The script's own exit status, never a pipeline's.
      - name: Gate
        run: cargo xtask gate

  msrv:
    name: MSRV 1.98
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `rust-version = "1.98"` in Cargo.toml is a promise to anyone who embeds these crates.
      - uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build on the declared rust-version
        run: cargo build --workspace --locked
