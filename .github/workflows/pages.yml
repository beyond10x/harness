# Atlas-classified former Pages workflow: repository-owned validation only; deployment authority is forbidden.
# Repository-owned validation and artifact production only; no deployment authority.
name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97'
          components: rustfmt, clippy
      - name: Check, test and build the exact static site
        run: |
          cargo fmt --manifest-path website/Cargo.toml --check
          cargo test --manifest-path website/Cargo.toml --locked
          cargo clippy --manifest-path website/Cargo.toml --all-targets --locked -- -D warnings
          cargo run --manifest-path website/Cargo.toml --locked -- build --commit "$GITHUB_SHA"
      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
