name: Agentplugins compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 1"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: beyond10x/agentplugins
          ref: 0.3.1
          path: agentplugins
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Read the released planning skill and agents
        working-directory: harness
        run: |
          cargo test --locked -p b10x-harness-cli --lib \
            the_real_plugin_this_repository_ships_against_reads -- --ignored
          cargo test --locked -p b10x-harness-cli --lib \
            the_real_agents_this_repository_ships_against_read -- --ignored
