[workspace]
resolver = "3"
members = [
    "crates/harness-wire",
    "crates/harness-responses",
    "crates/harness-loop",
    "crates/harness-app-server",
    "crates/harness-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Daemonloom-Proprietary"
repository = "https://github.com/daemonloom/daemonloom"
publish = false

[workspace.dependencies]
harness-wire = { package = "daemonloom-harness-wire", path = "crates/harness-wire" }
harness-responses = { package = "daemonloom-harness-responses", path = "crates/harness-responses" }
harness-loop = { package = "daemonloom-harness-loop", path = "crates/harness-loop" }
harness-app-server = { package = "daemonloom-harness-app-server", path = "crates/harness-app-server" }

clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3.23"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
