[workspace]
resolver = "3"
members = [
    "crates/harness-wire",
    "crates/harness-credential",
    "crates/harness-http",
    "crates/harness-responses",
    "crates/harness-messages",
    "crates/harness-loop",
    "crates/harness-flow",
    "crates/harness-substrate",
    "crates/harness-tools",
    "crates/harness-app-server",
    "crates/harness-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/harness"
publish = false

[workspace.dependencies]
harness-wire = { package = "b10x-harness-wire", path = "crates/harness-wire" }
harness-credential = { package = "b10x-harness-credential", path = "crates/harness-credential" }
harness-http = { package = "b10x-harness-http", path = "crates/harness-http" }
harness-responses = { package = "b10x-harness-responses", path = "crates/harness-responses" }
harness-messages = { package = "b10x-harness-messages", path = "crates/harness-messages" }
harness-loop = { package = "b10x-harness-loop", path = "crates/harness-loop" }
harness-flow = { package = "b10x-harness-flow", path = "crates/harness-flow" }
harness-substrate = { package = "b10x-harness-substrate", path = "crates/harness-substrate" }
harness-tools = { package = "b10x-harness-tools", path = "crates/harness-tools" }
harness-app-server = { package = "b10x-harness-app-server", path = "crates/harness-app-server" }

clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
# The two `harness-tools` takes to give `search` a regular expression and a file filter. Both are
# BurntSushi's, both are what ripgrep itself matches with, and they share `regex-automata` and
# `regex-syntax` — so the second costs `bstr` and `log` on top of the first rather than a tree of
# its own. Hand-rolling either was the alternative: a glob matcher written here would be a second,
# subtly different answer to *does this path match `crates/**/*.rs`* on every machine that reads a
# run, and a hand-rolled regex engine is not a thing anyone should write twice.
globset = "0.4.19"
regex = "1.13"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The workflow notation reads its own documents (`Flow::from_yaml`), so the CLI never parses one
# itself. `_ng` is the maintained fork of `serde_yaml`, which was archived unmaintained in 2024.
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
tempfile = "3.23"
# The config format the operator hand-edits: `~/.config/b10x/harness.toml`. Taken rather than
# hand-parsed because a profile is executable policy and a half-read one grants what nobody wrote —
# the same reason `serde_json` is here and a JSON parser is not.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
