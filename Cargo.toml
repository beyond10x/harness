[workspace]
resolver = "3"
members = [
    "crates/harness-wire",
    "crates/harness-loop",
    "crates/harness-conformance",
    "crates/harness-flow",
    "crates/harness-toolchain",
    "crates/harness-substrate",
    "crates/harness-tools",
    "crates/harness-mcp",
    "crates/harness-app-server",
    "crates/harness-cli",
    "crates/harness-xtask",
]

[workspace.package]
version = "0.13.3"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/harness"
publish = false

[workspace.dependencies]
harness-wire = { package = "b10x-harness-wire", path = "crates/harness-wire" }
harness-loop = { package = "b10x-harness-loop", path = "crates/harness-loop" }
harness-flow = { package = "b10x-harness-flow", path = "crates/harness-flow" }
harness-toolchain = { package = "b10x-harness-toolchain", path = "crates/harness-toolchain" }
harness-substrate = { package = "b10x-harness-substrate", path = "crates/harness-substrate" }
harness-tools = { package = "b10x-harness-tools", path = "crates/harness-tools" }
harness-mcp = { package = "b10x-harness-mcp", path = "crates/harness-mcp" }
harness-app-server = { package = "b10x-harness-app-server", path = "crates/harness-app-server" }

clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
# The two `harness-tools` takes to give `search` a regular expression and a file filter. Both are
# BurntSushi's, both are what ripgrep itself matches with, and they share `regex-automata` and
# `regex-syntax` — so the second costs `bstr` and `log` on top of the first rather than a tree of
# its own. Hand-rolling either was the alternative: a glob matcher written here would be a second,
# subtly different answer to *does this path match `crates/**/*.rs`* on every machine that reads a
# run, and a hand-rolled regex engine is not a thing anyone should write twice.
globset = "0.4.19"
# Parses the standard HTTP date forms a peer may use in `Retry-After`. Reimplementing its three
# legacy grammars would make retry timing depend on a partial parser at the security boundary.
httpdate = "1.0.3"
# Structured output is not trusted merely because a provider accepted tool arguments. This is the
# draft-aware local validator that makes the exact schema published also decide whether `answer`
# completed; default features are off so no network or command-line surfaces arrive with it.
jsonschema = { version = "0.52.1", default-features = false }
# Hook and command timeouts stop the whole process group, not only the direct child. Unix process
# groups and signals are OS primitives; this narrow feature set avoids hand-written unsafe FFI.
nix = { version = "0.31.3", features = ["process", "signal"] }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The workflow notation reads its own documents (`Flow::from_yaml`), so the CLI never parses one
# itself. `_ng` is the maintained fork of `serde_yaml`, which was archived unmaintained in 2024.
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
tempfile = "3.23"
tokio = { version = "1.53", features = ["rt", "time", "macros"] }
# The config format the operator hand-edits: `~/.config/b10x/harness.toml`. Taken rather than
# hand-parsed because a profile is executable policy and a half-read one grants what nobody wrote —
# the same reason `serde_json` is here and a JSON parser is not.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

# MCP is a lower reusable protocol boundary, pinned like substrate rather than read from a sibling
# checkout. Harness supplies every envelope, approval, and publication decision itself.
b10x-mcp-command = { git = "https://github.com/beyond10x/mcp", rev = "bf7f9415fbd8a28abff789d7d39d2584a8f6d2b2" }
b10x-mcp-client = { git = "https://github.com/beyond10x/mcp", rev = "bf7f9415fbd8a28abff789d7d39d2584a8f6d2b2" }
b10x-mcp-config = { git = "https://github.com/beyond10x/mcp", rev = "bf7f9415fbd8a28abff789d7d39d2584a8f6d2b2" }
b10x-mcp-types = { git = "https://github.com/beyond10x/mcp", rev = "bf7f9415fbd8a28abff789d7d39d2584a8f6d2b2" }

llm-blocking = { package = "b10x-llm-blocking", git = "https://github.com/beyond10x/llm", tag = "0.1.7" }
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.1.7" }
llm-credentials = { package = "b10x-llm-credentials", git = "https://github.com/beyond10x/llm", tag = "0.1.7" }
llm-http = { package = "b10x-llm-http", git = "https://github.com/beyond10x/llm", tag = "0.1.7" }
llm-messages = { package = "b10x-llm-messages", git = "https://github.com/beyond10x/llm", tag = "0.1.7" }
llm-providers = { package = "b10x-llm-providers", git = "https://github.com/beyond10x/llm", tag = "0.1.7" }
llm-responses = { package = "b10x-llm-responses", git = "https://github.com/beyond10x/llm", tag = "0.1.7" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
