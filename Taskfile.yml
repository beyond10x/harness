version: '3'

tasks:
  check:
    desc: Run the full source gate, including ESS validation and native conformance
    cmds:
      - cargo xtask gate
  spec:
    desc: Validate the authored specification with its pinned ESS toolchain
    cmds:
      - ess specify validate --path spec --strict-requires
  conformance:
    desc: Compile, check synthesis drift and run the native ESS scenarios
    cmds:
      - cargo xtask specification
  docs-generate:
    desc: Regenerate the derived documentation pages (website/docs/reference/cli.md, toolchains.md, crates.md, website/docs/status.md, website/data/status.json)
    cmds:
      - cargo run --locked -p harness-docs -- generate
  docs-check:
    desc: Fail when a derived documentation page is missing, stale or edited, or a page under website/docs breaks the page rules
    cmds:
      - cargo run --locked -p harness-docs -- generate --check
  docs-site:
    desc: Build the Docusaurus site into website/build
    cmds:
      - npm --prefix website ci --allow-git=root
      - npm --prefix website run build
