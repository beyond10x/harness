[package]
name = "harness-docs"
description = "Generates the derived pages of the Harness documentation site (CLI, toolchains, crates, status), checks every page, and binds a built site to its commit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "harness-docs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
harness-cli = { package = "b10x-harness-cli", path = "../harness-cli" }
serde_json = { workspace = true }
tool-toolchain = { workspace = true }
