[package]
name = "b10x-harness-http"
description = "The transport half of a b10x provider wire: streaming HTTP, SSE framing, retry and status mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Four direct edges and no fourth-party package: `harness-wire` for the neutral error, sink and
# cancellation types; `reqwest` for HTTP; `serde_json` for frame payloads; and `tokio`, already in
# reqwest's graph, so a cancelled blocking port can drop asynchronous network work immediately.
[dependencies]
harness-wire = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
