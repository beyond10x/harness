[package]
name = "b10x-harness-substrate"
description = "A client of the substrate wire: what this machine can confine, and the tools that answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
harness-toolchain = { workspace = true }
harness-tools = { workspace = true }
harness-wire = { workspace = true }
# **The confinement dependency, and both boundaries it crosses are argued in
# `src/embedded.rs`.** substrate's own README says cross-component consumers use the released
# daemon artifact and the wire contract; this imports the driver. Embedding stays because it needs
# no deployment, and because the wire types turn a 422 nobody could diagnose into a compile error.
#
# **Pinned by a published git revision, never by path.** A `path` into a sibling checkout builds against
# whatever happens to be checked out there, and `--locked` cannot lock it — the gate was green
# against a tree no lockfile named (AGENTS.md invariant 2). Revision
# `3fafeae65fe6ee9f36c3ba17d49b36a1a0d1a3a3` is release `0.7.7`, which leaves Git metadata
# untouched when no Git sources are configured; the development wire remains `0.16.0`.
# Harness continues to request exact workspace access, no network and resource usage through the
# existing embedded driver boundary. Both version requirements are exact so a resolver cannot
# silently substitute a later contract for this selection.
substrate-host = { package = "b10x-substrate-host", git = "https://github.com/beyond10x/substrate", rev = "3fafeae65fe6ee9f36c3ba17d49b36a1a0d1a3a3", version = "=0.7.7" }
substrate-wire = { package = "b10x-substrate-wire", git = "https://github.com/beyond10x/substrate", rev = "3fafeae65fe6ee9f36c3ba17d49b36a1a0d1a3a3", version = "=0.7.7" }
# Only to drive an async driver from a blocking workspace: one current-thread runtime, `block_on`
# per operation, no concurrency anywhere.
tokio = { version = "1", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Only to content-address a staged driver: the directory a read-only root points at is named by the
# digest of the program in it, so a rebuilt binary cannot be served out of the previous run's stage.
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
harness-tools = { workspace = true }
harness-wire = { workspace = true }
tempfile = { workspace = true }
