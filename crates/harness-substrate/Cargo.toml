[package]
name = "b10x-harness-substrate"
description = "A client of the substrate wire: what this machine can confine, and the tools that answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
harness-tools = { workspace = true }
harness-wire = { workspace = true }
# **The one dependency on a sibling component, and both boundaries it crosses are argued in
# `src/embedded.rs`.** substrate's own README says cross-component consumers use the released
# daemon artifact and the wire contract; this imports the driver. The socket path works against a
# daemon built from this revision (verified 2026-08-29); embedding stays because it needs no
# deployment, and because the wire types turn a 422 nobody could diagnose into a compile error.
#
# **Pinned by revision, never by path.** A `path` into a sibling checkout builds against whatever
# happens to be checked out there, and `--locked` cannot lock it — the gate was green against a tree
# no lockfile named (AGENTS.md invariant 2). The revision is substrate `0.2.0` plus its brand sweep,
# three commits: the tag itself still carries the former brand in a wire hash domain
# (`EXECUTION_CAPSULE_HASH_DOMAIN`), and the org fence says it appears nowhere. When substrate tags
# again, this becomes `tag = "<version>"` and nothing else changes.
substrate-host = { git = "https://github.com/beyond10x/substrate", rev = "f1cfc1c022020e494b9ad63ee725be27ecd313d3", version = "0.2.0" }
substrate-wire = { git = "https://github.com/beyond10x/substrate", rev = "f1cfc1c022020e494b9ad63ee725be27ecd313d3", version = "0.2.0" }
# Only to drive an async driver from a blocking workspace: one current-thread runtime, `block_on`
# per operation, no concurrency anywhere.
tokio = { version = "1", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Only to content-address a staged driver: the directory a read-only root points at is named by the
# digest of the program in it, so a rebuilt binary cannot be served out of the previous run's stage.
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
harness-tools = { workspace = true }
harness-wire = { workspace = true }
tempfile = { workspace = true }
