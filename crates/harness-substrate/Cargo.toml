[package]
name = "b10x-harness-substrate"
description = "A client of the substrate wire: what this machine can confine, and the tools that answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
harness-toolchain = { workspace = true }
harness-tools = { workspace = true }
harness-wire = { workspace = true }
# **The one dependency on a sibling component, and both boundaries it crosses are argued in
# `src/embedded.rs`.** substrate's own README says cross-component consumers use the released
# daemon artifact and the wire contract; this imports the driver. The socket path was verified
# 2026-08-29 against a daemon built from substrate `f1cfc1c` (`1b1f6a8` here), and that still holds
# at the pinned `43c5a10`: substrate's wire and daemon crates gained only a test in between, and the
# range's one production change — `substrate-host`'s `validate_root_name` — only widens which names
# a workspace root may take, while `tests/live.rs` mints its own through `workspace_create`.
# Embedding stays because it needs no deployment, and because the wire types turn a 422 nobody could
# diagnose into a compile error.
#
# **Pinned by revision, never by path.** A `path` into a sibling checkout builds against whatever
# happens to be checked out there, and `--locked` cannot lock it — the gate was green against a tree
# no lockfile named (AGENTS.md invariant 2). The tag is substrate `0.2.2` (2026-08-29, the revision
# `43c5a10` the lockfile resolved it to): the release whose workspace adoption drops the `ws_`
# root-name requirement, which is what lets a run be pointed at a directory the operator already
# owns rather than at a `ws_`-named scratch copy of it (`0c31438` here). **The floor is `0.2.2`.**
# Both `version` requirements below are `^0.2.2`, so cargo refuses a lower tag until they move too;
# and moving them buys a driver that adopts an operator-named directory and then refuses the first
# write into it with `workspace.path-escape`, because `0.2.1`'s `validate_root_name` still wants
# `ws_`. Nothing in this crate's suite covers that, so a rollback would look green. `0.2.1` earns
# its mention only as the first release after the capsule hash-domain migration; the former bytes
# are intentionally not copied into this repository.
substrate-host = { git = "https://github.com/beyond10x/substrate", tag = "0.2.2", version = "0.2.2" }
substrate-wire = { git = "https://github.com/beyond10x/substrate", tag = "0.2.2", version = "0.2.2" }
# Only to drive an async driver from a blocking workspace: one current-thread runtime, `block_on`
# per operation, no concurrency anywhere.
tokio = { version = "1", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Only to content-address a staged driver: the directory a read-only root points at is named by the
# digest of the program in it, so a rebuilt binary cannot be served out of the previous run's stage.
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
harness-tools = { workspace = true }
harness-wire = { workspace = true }
tempfile = { workspace = true }
