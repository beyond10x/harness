[package]
name = "b10x-harness-substrate"
description = "A client of the substrate wire: what this machine can confine, and the tools that answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
harness-toolchain = { workspace = true }
harness-tools = { workspace = true }
harness-wire = { workspace = true }
# **The one dependency on a sibling component, and both boundaries it crosses are argued in
# `src/embedded.rs`.** substrate's own README says cross-component consumers use the released
# daemon artifact and the wire contract; this imports the driver. Embedding stays because it needs
# no deployment, and because the wire types turn a 422 nobody could diagnose into a compile error.
#
# **Pinned by a released git tag, never by path.** A `path` into a sibling checkout builds against
# whatever happens to be checked out there, and `--locked` cannot lock it — the gate was green
# against a tree no lockfile named (AGENTS.md invariant 2). The tag is substrate `0.4.0`
# (2026-09-01, merge revision `31340a6`): the release whose applied record carries exact
# read-only/scoped/read-write workspace authority and resource usage. Both version requirements are
# exact so a resolver cannot silently substitute a later contract for the one tested here.
substrate-host = { package = "b10x-substrate-host", git = "https://github.com/beyond10x/substrate", tag = "0.4.0", version = "=0.4.0" }
substrate-wire = { package = "b10x-substrate-wire", git = "https://github.com/beyond10x/substrate", tag = "0.4.0", version = "=0.4.0" }
# Only to drive an async driver from a blocking workspace: one current-thread runtime, `block_on`
# per operation, no concurrency anywhere.
tokio = { version = "1", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Only to content-address a staged driver: the directory a read-only root points at is named by the
# digest of the program in it, so a rebuilt binary cannot be served out of the previous run's stage.
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
harness-tools = { workspace = true }
harness-wire = { workspace = true }
tempfile = { workspace = true }
