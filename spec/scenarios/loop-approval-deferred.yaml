type: ess-scenario/4
domain: harness.loop
scenario: loop-approval-deferred
summary: A deferred approval suspends the run at a harness.approval-checkpoint/1 checkpoint; the ledger holds the one turn spent.
timeline:
  - at: 2026-10-30T00:00:00Z
    command: harness.loop.StartLoop
    input: {run_id: run-a}
    outcome: requested
    response: {turn: 1}
  - at: 2026-10-30T00:00:01Z
    command: harness.loop.CallTool
    input: {run_id: run-a, call_id: call-7, tool: write, text: short}
    outcome: asked
    response: {turn: 1}
  - at: 2026-10-30T00:00:02Z
    command: harness.loop.Defer
    input: {run_id: run-a, checkpoint_id: cp-1}
    outcome: deferred
    response:
      stop: {kind: awaiting-approval, value: {checkpoint_id: cp-1}}
      ledger:
        usage:
          - {model: fixture, input_tokens: 100, output_tokens: 10, cached_input_tokens: 0}
        cost_micro_usd: null
        turns: 1
assert:
  - view: harness.loop.Loops
    contains: {run_id: run-a, state: Suspended, turns: 1, retries: 0}
