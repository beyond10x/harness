type: ess-scenario/4
domain: harness.loop
scenario: loop-failed-after-a-failed-summary
summary: A summary turn that failed on the wire still counts as a compaction, so a conversation request that fails next says it followed one.
timeline:
  - at: 2026-10-30T00:00:00Z
    command: harness.loop.StartLoop
    input: {run_id: run-a}
    outcome: requested
    response: {turn: 1}
  - at: 2026-10-30T00:00:01Z
    command: harness.loop.CallTool
    input: {run_id: run-a, call_id: call-1, tool: read, text: long}
    outcome: called-long
    response: {turn: 1}
  - at: 2026-10-30T00:00:02Z
    command: harness.loop.CompleteTool
    input: {run_id: run-a}
    outcome: returned-then-summarise
    response: {turn: 2}
  - at: 2026-10-30T00:00:03Z
    command: harness.loop.FailSummary
    input: {run_id: run-a}
    outcome: kept
    response: {turn: 3}
  - at: 2026-10-30T00:00:04Z
    command: harness.loop.FailTurn
    input: {run_id: run-a, retriable: false}
    outcome: failed
    response:
      turn: 3
      stop:
        kind: failed
        value: {cause: provider-protocol, message: 'model wire refused: Protocol: the provider refused the request', after_compaction: true}
      ledger:
        usage:
          - {model: fixture, input_tokens: 100, output_tokens: 10, cached_input_tokens: 0}
        cost_micro_usd: null
        turns: 3
assert:
  - view: harness.loop.Loops
    contains: {run_id: run-a, state: Failed, turns: 3, retries: 0}
